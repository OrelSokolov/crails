# The distribution shard of the CRails monorepo: `carat install
# OrelSokolov/crails` clones the repo, resolves the framework deps at the
# root (prebuild) and builds the `crails` CLI from the src/crails_cli.cr
# shim over the railties_cr library. Framework shards (railties included)
# live in their own OrelSokolov/*.cr repos and resolve from GitHub tags.
name: crails
version: 0.1.13
crystal: ">= 1.21.0"
description: Rails-port MVC framework on Crystal — the crails CLI and the full-stack framework
license: MIT
dependencies:
  railties_cr:
    github: OrelSokolov/railties.cr
    version: ~> 0.1.18
  attr_reader_cr:
    github: OrelSokolov/attr_reader.cr
    version: ~> 0.1.0
  active_support_cr:
    github: OrelSokolov/active_support.cr
    version: ~> 0.1.0
  action_view_cr:
    github: OrelSokolov/action_view.cr
    version: ~> 0.1.0
  action_pack_cr:
    github: OrelSokolov/action_pack.cr
    version: ~> 0.2.0
  importmap_cr:
    github: OrelSokolov/importmap.cr
    version: ~> 0.1.0
  propshaft_cr:
    github: OrelSokolov/propshaft.cr
    version: ~> 0.1.0
  # propshaft_cr precompresses assets with brotli at the app's compile
  # time; published propshaft tags resolve it transitively — declared
  # here so the store lib/ always carries it for generated apps.
  brotli:
    github: OrelSokolov/brotli.cr
    version: ~> 0.3.0
  active_record_cr:
    github: OrelSokolov/active_record.cr
    version: ~> 0.1.0
  erb_cr:
    github: OrelSokolov/erb.cr
    version: ~> 0.1.0
  icr:
    github: OrelSokolov/icr.cr
  # crails watch — dev-loop file watcher (railties_cr dep; declared here
  # so the root prebuild resolves it, like every other framework dep)
  project_watch:
    github: OrelSokolov/project_watch.cr
    version: ~> 0.1.0
binaries:
  crails:
    main: src/crails_cli.cr
# Дублируем для обычного shards build (carat игнорирует targets,
# shards не знает binaries).
targets:
  crails:
    main: src/crails_cli.cr
