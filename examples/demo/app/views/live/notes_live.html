<div class="lv-card">
  <form phx-submit="create" class="lv-form">
    <input type="text" name="note[title]" placeholder="Note title" required>
    <input type="text" name="note[body]" placeholder="Body (optional)">
    <button class="btn primary" type="submit">Create</button>
  </form>
  <div class="lv-status" data-status="<%= @last_created %>"><%= @last_created %></div>
  <ul class="lv-list" data-count="<%= @titles.size %>">
    <%= lv_each(@titles) do |title| %>
      <li><%= title %></li>
    <% end %>
  </ul>
  <button class="btn" phx-click="refresh">Refresh list</button>
</div>
